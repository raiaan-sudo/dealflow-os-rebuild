name: DealFlow Engineering OS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealflow-engineering-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Predeploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Offline smoke
        run: npm run smoke:offline

      - name: Route security
        run: npm run routes:security

      - name: Run Engineering OS predeploy validation
        env:
          ENGINEERING_OS_PROOF_DIR: data/engineering-proof-artifacts/ci-${{ github.run_id }}
        run: npm run validate:predeploy -- --mission-id ci-${{ github.run_id }} --environment ci

      - name: Summarize proof artifacts
        if: always()
        env:
          ENGINEERING_OS_PROOF_DIR: data/engineering-proof-artifacts/ci-${{ github.run_id }}
        run: npm run proof:latest

      - name: Verify proof artifacts
        if: always()
        env:
          ENGINEERING_OS_PROOF_DIR: data/engineering-proof-artifacts/ci-${{ github.run_id }}
        run: npm run proof:verify

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-proof-artifacts-${{ github.run_id }}
          path: data/engineering-proof-artifacts/
          if-no-files-found: ignore
