name: DealFlow Engineering OS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealflow-engineering-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Predeploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Supply-chain contract
        run: npm run test:supply-chain

      - name: Lockfile SBOM and license inventory
        run: npm run supply-chain:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Release secret scan
        run: npm run security:scan-release

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Offline smoke
        run: npm run smoke:offline

      - name: Production route contract
        run: npm run test:production-route-contract

      - name: Route security
        run: npm run routes:security
