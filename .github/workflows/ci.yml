name: DealFlow Engineering OS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealflow-engineering-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Predeploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Public funnel guard
        run: npm run guard:public-funnel

      - name: Canonical public funnel regression
        run: npm run test:canonical-public-funnel

      - name: Campaign public funnel paths
        run: npm run test:campaign-public-funnel-paths

      - name: Public funnel mobile conversion checks
        run: npm run test:public-funnel-mobile

      - name: Lead tracking health regression
        run: npm run test:lead-tracking-health

      - name: Build
        run: npm run build

      - name: Offline smoke
        run: npm run smoke:offline

      - name: Route security
        run: npm run routes:security

      - name: Schema check
        run: npm run schema:check
        env:
          SUPABASE_SCHEMA_CHECK_MODE: local

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Whitespace diff guard
        run: git diff --check
